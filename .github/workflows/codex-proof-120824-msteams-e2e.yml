name: Secretless proof 120824 msteams e2e

on:
  push:
    branches:
      - codex/proof-120824-msteams-e2e
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: msteams QA proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run focused Microsoft Teams QA tests
        run: |
          set -euo pipefail
          pnpm test \
            extensions/msteams/src/qa/adapter.runtime.test.ts \
            extensions/msteams/src/qa/graph-server.test.ts \
            extensions/msteams/src/qa/private-runtime.test.ts

      - name: Build private QA runtime
        run: OPENCLAW_BUILD_PRIVATE_QA=1 pnpm build

      - name: Run Microsoft Teams thread pagination scenario
        id: qa
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_ENABLE_PRIVATE_QA_CLI: "1"
          OPENCLAW_DISABLE_BUNDLED_PLUGINS: "0"
          OPENCLAW_QA_REDACT_PUBLIC_METADATA: "1"
        run: |
          set -euo pipefail
          output_dir=.artifacts/qa-e2e/msteams-thread-reply-pagination
          pnpm openclaw qa run \
            --repo-root . \
            --qa-profile smoke-ci \
            --concurrency 1 \
            --output-dir "$output_dir" \
            --scenario msteams-thread-reply-pagination
          jq -c '{status, scenarios: [.scenarios[] | {name, status, details}]}' \
            "$output_dir/qa-suite-summary.json"

      - name: Upload Microsoft Teams QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: msteams-thread-reply-pagination-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/qa-e2e/msteams-thread-reply-pagination
          if-no-files-found: warn
          retention-days: 7
